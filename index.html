<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>
  
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <h1>Expense Tracker</h1>


    <!-- TOTAL -->

    <div class="total-card">

        <p>Total Spending</p>

        <h2 id="total">₹0</h2>

    </div>


    <!-- BUDGET -->

    <div class="budget-card">

        <div class="budget-header">

            <div>
                <p>Monthly Budget</p>
                <h2 id="budgetDisplay">₹0</h2>
            </div>

            <button id="budgetButton">
                Set Budget
            </button>

        </div>


        <div class="budget-info">

            <span>
                Spent: <strong id="budgetSpent">₹0</strong>
            </span>

            <span>
                Remaining: <strong id="budgetRemaining">₹0</strong>
            </span>

        </div>


        <div class="progress-background">

            <div
                id="progressBar"
                class="progress-bar">
            </div>

        </div>

    </div>


    <!-- STATISTICS -->

    <div class="stats">

        <div class="stat-card">

            <p>Total Expenses</p>

            <h3 id="expenseCount">
                0
            </h3>

        </div>


        <div class="stat-card">

            <p>Today's Spending</p>

            <h3 id="todayTotal">
                ₹0
            </h3>

        </div>

    </div>


    <!-- ADD EXPENSE -->

    <div class="form">

        <input
            type="text"
            id="description"
            placeholder="Expense name"
        >


        <input
            type="number"
            id="amount"
            placeholder="Amount"
        >


        <select id="category">

            <option value="Food">
                Food
            </option>

            <option value="Travel">
                Travel
            </option>

            <option value="Shopping">
                Shopping
            </option>

            <option value="Bills">
                Bills
            </option>

            <option value="Education">
                Education
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <input
            type="date"
            id="date"
        >


        <button id="addButton">
            Add Expense
        </button>

    </div>


    <!-- SEARCH -->

    <div class="filters">

        <input
            type="text"
            id="search"
            placeholder="Search expenses..."
        >


        <select id="filterCategory">

            <option value="All">
                All Categories
            </option>

            <option value="Food">
                Food
            </option>

            <option value="Travel">
                Travel
            </option>

            <option value="Shopping">
                Shopping
            </option>

            <option value="Bills">
                Bills
            </option>

            <option value="Education">
                Education
            </option>

            <option value="Other">
                Other
            </option>

        </select>

    </div>


    <!-- EXPENSES -->

    <h3>Expenses</h3>

    <div id="expenseList"></div>

</div>


<script src="script.js"></script>

</body>

</html>
